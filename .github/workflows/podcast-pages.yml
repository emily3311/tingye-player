# Install as .github/workflows/podcast-pages.yml in emily3311/tingye-player.
# Requires deployment/podcast-pages/build_site.py and Pages source GitHub Actions.
name: Publish podcast media on Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: podcast-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Install audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build public feed and audio only
        run: python3 deployment/podcast-pages/build_site.py --source . --output _site --compact-audio
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
