name: Recover verified podcast deployment 2026-10-19
on:
  workflow_dispatch:
permissions: {}
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore the already built 25 episode site
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '12200815271'
          run-id: '39276544984'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered
          digest-mismatch: error
      - name: Verify complete site before publishing
        run: |
          python3 - <<'PY'
          import json, tarfile, xml.etree.ElementTree as ET
          from pathlib import PurePosixPath
          expected = {"0975814bf3274aca9e1544588c707997": 116922285, "11730c02b46645d286a70767820871d2": 115241517, "13cc77ce399349018544452e7f4d76c6": 61137069, "20514ca799da4061bbe1a9a2f4af161b": 128996781, "218dcc318c394fe9b06c275a8cce724a": 74976045, "25751d42fa63433abf30f48980b7b3fa": 76183341, "33b43fe1d733401fbf67bce8c54a3901": 64939053, "62dffb15594a43ec804097008acbdc16": 61076397, "63aa0834b14c46729a14ae3465a99f00": 73946541, "6448fbfd291c4e3e8276f3797b8dbcf4": 120077229, "6659118ed0a4457997416d9fe0b4d1a1": 92293293, "7a41ac8e1c354837ab26b7c633ec042f": 58688685, "81b28a970fcc4621b6ca8faeef231da8": 87889581, "874400ace488455db09c8ab1a7dac43a": 113244333, "8d362a9f95da4e1787a2334565a5efd9": 94050477, "9207f2174d6a467c9dd347adde8c07b0": 62649261, "9d392539b29543a5a1297f1b8b4fe886": 125946669, "a256dfb781c94bfab2b0aa88dfa72f10": 77799213, "b1b3bfdb07f944599f7b50a9c6a1a036": 70290861, "b6c4a47a340d4f5791da8c354678d06b": 160139949, "c27619cc5fbe440d8ccb85cf296fcfc9": 1013037, "db73cb771ba24d9fa703e851bdfcb970": 160177965, "e296634fa77344edaf26c54f4e9ccc04": 107045037, "e6ff07f3755e4aa89e68121237fe9447": 81538989, "fb65ac4e02d7419fa8a641f6f96eb56e": 147634989}
          with tarfile.open('recovered/artifact.tar') as archive:
              files = {}
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() or member.isdir()
                  if member.isfile():
                      name = str(path)
                      assert name not in files
                      files[name] = member
              assert sum(member.size for member in files.values()) < 1_000_000_000
              feed = ET.fromstring(archive.extractfile(files['feed.xml']).read())
              media = json.load(archive.extractfile(files['media.json']))
              assert feed.findtext('./channel/title') == 'Emily GO GO GO'
              items = feed.findall('./channel/item')
              assert len(items) == 25
              assert {item.findtext('guid').split(':')[-1] for item in items} == set(expected)
              assert not any('中性' in item.findtext('title', '') for item in items)
              for item in items:
                  identity = item.findtext('guid').split(':')[-1]
                  enclosure = item.find('enclosure').attrib
                  size = files['audio/' + identity + '.mp3'].size
                  url = 'https://emily3311.github.io/tingye-player/audio/' + identity + '.mp3'
                  assert enclosure == {'url':url, 'length':str(size), 'type':'audio/mpeg'}
                  assert media[identity] == {'url':url, 'bytes':size, 'source_bytes':expected[identity]}
          print('Validated all 25 episodes in the existing immutable Pages artifact.')
          PY
      - name: Attach the unchanged Pages tar to this recovery run
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: recovered/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Deploy the complete verified site
        id: deployment
        uses: actions/deploy-pages@v4
